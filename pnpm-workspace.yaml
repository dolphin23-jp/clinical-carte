packages:
  - packages/*
  - apps/*

# 複数のパッケージで使う依存の版は、ここでそろえる（package.json では "catalog:" と書く）。
# 版は clinical-casebook・clinical-atlas に合わせた。
catalog:
  "@cloudflare/workers-types": ^5.20261019.1
  "@eslint/js": ^10.0.1
  "@types/node": ^22.20.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  eslint: ^10.11.0
  fast-check: ^4.10.2
  globals: ^17.12.0
  playwright-core: ^1.63.0
  react: ^19.3.0
  react-dom: ^19.3.0
  # typescript-eslint が対応するのは TypeScript 6.0 まで（6.1 未満）。TS 7 には上げない。
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  vite: ^8.3.1
  vitest: ^5.0.2
  zod: ^4.6.5
